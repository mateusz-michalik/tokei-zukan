<script>
  // Apply the saved theme before first paint so dark mode doesn't flash light. The app keeps it in step afterwards.
  try {
    const t = (JSON.parse(localStorage.getItem('wristcheck.v2') || '{}') || {}).theme;
    const dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  } catch {}
</script>
