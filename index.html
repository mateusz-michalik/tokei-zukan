<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Site icon: the day dial in light mode, the dusk-lume dial in dark (the theme script below and src/lib/theme.ts swap
     the SVG link's href). Without JavaScript, and in favicon.ico for browsers without SVG icons, it's dusk-lume. -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml" id="favicon">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<!-- share:start -->
<!-- Link previews. The build replaces this block in the copies it writes for each watch: see src/lib/share.ts. -->
<title>Tokei Zukan</title>
<meta name="description" content="Explore watches, compare their sizes to scale and see how they wear on your wrist.">
<link rel="canonical" href="https://www.tokeizukan.com/">
<meta property="og:site_name" content="Tokei Zukan">
<meta property="og:type" content="website">
<meta property="og:title" content="Tokei Zukan">
<meta property="og:description" content="Explore watches, compare their sizes to scale and see how they wear on your wrist.">
<meta property="og:url" content="https://www.tokeizukan.com/">
<meta property="og:image" content="https://www.tokeizukan.com/share/tokei-zukan.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Tokei Zukan: a row of watch illustrations drawn to scale.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Tokei Zukan">
<meta name="twitter:description" content="Explore watches, compare their sizes to scale and see how they wear on your wrist.">
<meta name="twitter:image" content="https://www.tokeizukan.com/share/tokei-zukan.jpg">
<meta name="twitter:image:alt" content="Tokei Zukan: a row of watch illustrations drawn to scale.">
<!-- share:end -->
<script>
  // Apply the saved theme before first paint so dark mode doesn't flash light. The app keeps it in step afterwards.
  // Pages are light unless the visitor chose dark, or chose to match a device that's in dark mode.
  const theme = dark => {
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.getElementById('favicon').href = dark ? '/favicon.svg' : '/favicon-light.svg';
  };
  theme(false);
  try {
    let saved = {};
    for (const key of ['tokeizukan.v2', 'wristcheck.v2']) {
      try {
        const candidate = JSON.parse(localStorage.getItem(key) || 'null');
        if (candidate?.version === 2) { saved = candidate; break; }
      } catch {} // A corrupt new key must not hide a usable legacy theme.
    }
    // A `system` saved before light became the default (no themeVersion) was that default, not a choice.
    const t = saved.theme === 'system' && saved.themeVersion !== 2 ? 'light' : saved.theme;
    const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    theme(dark);
  } catch {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,700..800&family=EB+Garamond:ital,wght@0,400;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
