name: Build

# Runs the same checks as `npm run build` on every pull request and on main. Pull requests from forks run with
# read-only access and no secrets: the build needs no credentials.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
